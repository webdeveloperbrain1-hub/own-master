# Free trial alternative for the existing Ohio service. No paid database/disk.
# Use a FREE Supabase project and a FREE Brevo sender with SMTP port 2525.
services:
  - type: web
    name: own-master
    runtime: docker
    region: ohio
    branch: main
    plan: free
    autoDeployTrigger: 'off'
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: node server/startTrial.mjs
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: APP_ORIGIN
        value: https://own-master-chi.vercel.app
      - key: CORS_ORIGIN
        value: https://own-master-chi.vercel.app
      - key: VITE_API_BASE_URL
        value: ''
      - key: BUSINESS_NAME
        value: Own Masters
      - key: SUPPORT_EMAIL
        value: admin@teddbernard.com
      - key: AI_FEATURES_ENABLED
        value: 'false'
      - key: BILLING_MODE
        value: preview
      - key: CONTRACT_STORAGE_ROOT
        value: /var/lib/ownmasters/storage
      - key: FILE_STORAGE_BACKEND
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: own-masters-private
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_STORAGE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EMAIL_DELIVERY_MODE
        value: smtp
      - key: SMTP_HOST
        value: smtp-relay.brevo.com
      - key: SMTP_PORT
        value: '2525'
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
