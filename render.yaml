# Prepared deployment option. Creating these resources incurs Render charges.
# Review plans and supply SMTP credentials before deploying this Blueprint.
services:
  - type: web
    name: own-masters-api
    runtime: docker
    region: singapore
    plan: 1c-2g
    autoDeployTrigger: 'off'
    dockerfilePath: ./Dockerfile
    dockerContext: .
    preDeployCommand: npm run db:deploy
    healthCheckPath: /api/health
    disk:
      name: own-masters-files
      mountPath: /var/lib/ownmasters/storage
      sizeGB: 5
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: APP_ORIGIN
        value: https://own-master-chi.vercel.app
      - key: CORS_ORIGIN
        value: https://own-master-chi.vercel.app
      - key: VITE_API_BASE_URL
        value: ''
      - key: BUSINESS_NAME
        value: Own Masters
      - key: SUPPORT_EMAIL
        value: admin@teddbernard.com
      - key: CONTRACT_STORAGE_ROOT
        value: /var/lib/ownmasters/storage
      - key: DATABASE_URL
        fromDatabase:
          name: own-masters-db
          property: connectionString
      - key: EMAIL_DELIVERY_MODE
        value: smtp
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: AI_FEATURES_ENABLED
        value: 'false'
      - key: BILLING_MODE
        value: preview
databases:
  - name: own-masters-db
    region: singapore
    plan: 0.1c-256mb
    postgresMajorVersion: '16'
    databaseName: ownmasters
    user: ownmasters
    diskSizeGB: 5
    ipAllowList: []
